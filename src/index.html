<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>sm64js</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

</head>

<body>
<style>
  html,body{background:#0a0a12;color:#e8e8f0;font-family:system-ui,sans-serif;margin:0;height:100%;overflow:hidden}
  #totlLoader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 30%,#1a1033 0%,#0a0a12 70%);z-index:10}
  #totlLoader.hide{display:none}
  .totl-ring{width:84px;height:84px;border-radius:50%;border:3px solid transparent;background:linear-gradient(#0a0a12,#0a0a12) padding-box,linear-gradient(135deg,#6f3cff,#63edff,#ff7cc8) border-box;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .totl-title{font-size:28px;letter-spacing:6px;font-weight:200}
  .totl-title b{font-weight:700;background:linear-gradient(135deg,#6f3cff,#63edff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #romMessage{color:#9aa;font-size:13px;max-width:420px;text-align:center;padding:0 20px}
  .totl-progress{width:min(420px,80vw);height:6px;background:#1a1a2a;border-radius:3px;overflow:hidden}
  #totlLoadBar{height:100%;width:0%;background:linear-gradient(90deg,#6f3cff,#63edff);border-radius:3px;transition:width .2s}
  #totlLoadPct{color:#9aa;font-size:12px}
  #totlBar{position:fixed;top:0;left:0;right:0;display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,10,18,.7);backdrop-filter:blur(8px);z-index:5;font-size:13px}
  #totlBar.show{display:flex}
  #totlBar a{color:#8ab4ff;text-decoration:none}
  #totlBar .stats{color:#9aa;font-size:11px;display:flex;gap:12px}
  #gameWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #gameCanvas{position:fixed;inset:0;margin:auto;max-width:100vw;max-height:100vh;z-index:4}
  #gameWrap.hide{display:none}
  canvas#fullCanvas{max-width:100vw;max-height:100vh;cursor:none}
  .hidden-el{display:none!important}
</style>
<div id="totlLoader">
  <div class="totl-ring"></div>
  <div class="totl-title"><b>verse</b> sm64</div>
  <div class="totl-progress"><div id="totlLoadBar"></div></div>
  <div id="totlLoadPct"></div>
  <h6 id="romMessage">preparing...</h6>
  <div id="rom" hidden>
    <form id="romSelect"><input id="romFile" type="file"><input type="submit" value="load"></form>
  </div>
  <button id="startbutton" class="hidden-el">start</button>
  <select id="mapSelect" class="hidden-el"><option value="16">Castle Grounds</option></select>
  <input id="slider" class="hidden-el" type="range">
  <span id="fps" class="hidden-el"></span><span id="maxFps" class="hidden-el"></span><span id="timing-total" class="hidden-el"></span>
</div>
<div id="totlBar"><a href="../">&#8592; verse</a><div class="stats"><span id="fpsBar"></span></div></div>
<canvas id="gameCanvas" width="640" height="480" hidden></canvas>
<div id="gameWrap" class="hide">
<canvas id="fullCanvas" width="640" height="480"></canvas>
</div>

    
<script>
window.__errs=[];
window.onerror=function(m,s,ln,col){var t="ERR: "+m+" @"+ln+":"+col;window.__errs.push(t);var d=document.getElementById("romMessage");if(d){d.innerHTML=t;d.style="color:#ff667a"};return false;};
window.addEventListener("unhandledrejection",function(e){var t="REJECT: "+((e.reason&&e.reason.message)||e.reason);window.__errs.push(t);var d=document.getElementById("romMessage");if(d){d.innerHTML=t;d.style="color:#ff667a"}});
</script>
</body>
</html>
