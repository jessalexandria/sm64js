<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>sm64js</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

</head>

<body>
<style>
  html,body{background:#0a0a12;color:#e8e8f0;font-family:system-ui,sans-serif;margin:0;height:100%;overflow:hidden}
  #totlLoader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 30%,#1a1033 0%,#0a0a12 70%);z-index:10}
  #totlLoader.hide{display:none}
  .totl-ring{width:84px;height:84px;border-radius:50%;border:3px solid transparent;background:linear-gradient(#0a0a12,#0a0a12) padding-box,linear-gradient(135deg,#6f3cff,#63edff,#ff7cc8) border-box;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .totl-title{font-size:28px;letter-spacing:6px;font-weight:200}
  .totl-title b{font-weight:700;background:linear-gradient(135deg,#6f3cff,#63edff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #romMessage{color:#9aa;font-size:13px;max-width:420px;text-align:center;padding:0 20px}
  .totl-progress{width:min(420px,80vw);height:6px;background:#1a1a2a;border-radius:3px;overflow:hidden}
  #totlLoadBar{height:100%;width:0%;background:linear-gradient(90deg,#6f3cff,#63edff);border-radius:3px;transition:width .2s}
  #totlLoadPct{color:#9aa;font-size:12px}
  #gameWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #gameCanvas{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;z-index:4}
  #gameWrap.hide{display:none}
  canvas#fullCanvas{max-width:100vw;max-height:100vh;cursor:none}
  .hidden-el{display:none!important}

  #avatarSelect{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0a0a12}
  #avatarSelect.hide{display:none}
  .avatar-card{background:#14141f;border:1px solid #2a2a3d;border-radius:16px;padding:32px;width:340px;text-align:center}
  .avatar-title{color:#fff;font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
  .avatar-imported{color:#8ab4ff;font-size:12px;margin-bottom:12px}
  .avatar-imported.hide{display:none}
  #avatarName{background:#0a0a12;border:1px solid #2a2a3d;color:#fff;border-radius:8px;padding:10px 14px;font-size:15px;width:100%;box-sizing:border-box;margin-bottom:16px;text-align:center;outline:none}
  #avatarName:focus{border-color:#6f3cff}
  .tone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .tone-swatch{height:44px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:transform .1s}
  .tone-swatch:hover{transform:scale(1.05)}
  .tone-swatch.on{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.3)}
  #avatarEnter{background:linear-gradient(135deg,#6f3cff,#a72cff);color:#fff;border:none;border-radius:10px;padding:12px 48px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  #avatarEnter:hover{opacity:.9}
  #avatarHud{position:fixed;top:12px;left:12px;z-index:40;background:rgba(10,10,18,.75);border:1px solid #2a2a3d;border-radius:20px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px)}
  #avatarHud.hide{display:none}
  #avatarHudDot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  #avatarHudName{color:#fff;font-size:13px;font-weight:600}


  #buildHud{position:fixed;bottom:12px;left:12px;z-index:40;background:rgba(10,10,18,.85);border:1px solid #6f3cff;border-radius:12px;padding:10px 16px;color:#fff;font-size:13px}
  #buildHud.hide{display:none}
  #buildHud .title{color:#d779ff;font-weight:700;margin-bottom:4px}
  #buildHud .keys{color:#9aa;font-size:11px;margin-top:4px}
  #buildCrosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:39;color:#fff;font-size:24px;pointer-events:none;text-shadow:0 0 4px #000}
  #buildCrosshair.hide{display:none}

</style>
<div id="totlLoader">
  <div class="totl-ring"></div>
  <div class="totl-title"><b>verse</b> sm64</div>
  <div class="totl-progress"><div id="totlLoadBar"></div></div>
  <div id="totlLoadPct"></div>
  <h6 id="romMessage">preparing...</h6>
  <div id="rom" hidden>
    <form id="romSelect"><input id="romFile" type="file"><input type="submit" value="load"></form>
  </div>
  <button id="startbutton" class="hidden-el">start</button>
  <select id="mapSelect" class="hidden-el"><option value="16">Castle Grounds</option></select>
  <input id="slider" class="hidden-el" type="range">
  <span id="fps" class="hidden-el"></span><span id="maxFps" class="hidden-el"></span><span id="timing-total" class="hidden-el"></span>
</div>

<div id="avatarSelect" class="hide">
  <div class="avatar-card">
    <div class="avatar-title">choose your avatar</div>
    <div id="avatarImported" class="avatar-imported hide">imported from verse</div>
    <input id="avatarName" maxlength="24" placeholder="your name" />
    <div id="toneGrid" class="tone-grid"></div>
    <button id="avatarEnter">enter</button>
  </div>
</div>

<div id="buildHud" class="hide">
  <div class="title">build mode</div>
  <div id="buildInfo">crate | 0 placed</div>
  <div class="keys">enter: place | x: remove | 1/2: block | b: exit</div>
</div>
<div id="buildCrosshair" class="hide">+</div>

<div id="avatarHud" class="hide"><span id="avatarHudDot"></span><span id="avatarHudName"></span></div>

<canvas id="gameCanvas" width="960" height="540" hidden></canvas>
<div id="gameWrap" class="hide">
<canvas id="fullCanvas" width="640" height="480"></canvas>
</div>

    
<script>
window.__errs=[];
function totlShowErr(t){window.__errs.push(t);var d=document.getElementById("totlErr");if(!d){d=document.createElement("div");d.id="totlErr";d.style="position:fixed;bottom:0;left:0;right:0;background:#3b0b20;color:#ff667a;font:12px monospace;padding:8px;z-index:99999;white-space:pre-wrap";document.body.appendChild(d);}d.textContent=t;}
window.onerror=function(m,s,ln,col,err){var st="";try{st="\n"+(err&&err.stack||"").split("\n").slice(0,4).join("\n")}catch(x){} totlShowErr("ERR: "+m+" @"+ln+":"+col+st);return false;};
window.addEventListener("unhandledrejection",function(e){totlShowErr("REJECT: "+((e.reason&&e.reason.message)||e.reason))});
</script>
</body>
</html>
